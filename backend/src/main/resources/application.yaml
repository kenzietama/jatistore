server:
  forward-headers-strategy: framework

spring:
  application:
    name: JatiStore
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # Environment-variable driven so Spring doesn't validate a hardcoded
    # localhost connection before the active profile can override it.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jatistore?stringtype=unspecified}
    username: ${DB_USERNAME:developer}
    password: ${DB_PASSWORD:rahasia}
  jpa:
    hibernate:
      # Tell Hibernate to only validate the schema, leaving structural changes strictly to Flyway
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    # Enable Flyway database migrations
    enabled: true
    baseline-on-migrate: true
jwt:
  secret: ${JWT_SECRET:9aDf784GjkLpQweRtyUioPasDfgHjKlZxcVbnM1234567890QWERTYUIOPASDFGHJKLZXCVBNM_HS512_VERY_SECRET_AND_LONG_KEY}
  expiration-seconds:
    admin: 3600
    seller: 3600
    user: 3600

allowed:
  origins: ${ALLOWED_ORIGINS:http://localhost:5173}

cloudinary:
  url: ${CLOUDINARY_URL:cloudinary://653729848272621:_oe0o7FhXU_9-GDZi_Q2En2zJDA@dqoqfiucw}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha